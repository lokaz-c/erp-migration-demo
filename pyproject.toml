[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "erp-migration-demo"
version = "0.1.0"
description = "Excel-to-PostgreSQL ERP migration, reconstructed on synthetic data"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
# Exact pins: the generator and report are byte-for-byte reproducible only
# with the same library versions (Faker's name lists in particular).
dependencies = [
    "Faker==40.41.0",
    "openpyxl==3.1.5",
    "psycopg[binary]==3.3.6",
    "rapidfuzz==3.14.6",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
    "testcontainers==4.15.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
erp_migration = ["sql/*.sql", "sql/load/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs Docker to start a PostgreSQL 18 container"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
